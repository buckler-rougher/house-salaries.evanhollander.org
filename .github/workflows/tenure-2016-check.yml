name: Tenure 2016 Q1 Overlap Check (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute 2016 Q1 overlap with current staff
        run: python scripts/tenure_2016_check.py
